name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs

  web:
    name: Browser kit (unit tests, types, site build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_kit/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p .
      - run: npm run build:site
