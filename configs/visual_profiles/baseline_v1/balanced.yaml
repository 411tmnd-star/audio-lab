# balanced: a moderate, general-purpose response to energy, rhythmic activity and significant
# musical changes. Experimental creative choices, not rules about music.
#
# Rule inputs: feature (a curve from analysis.npz), onset_rate (onsets per second, counted from
# the analysis onset events), events (beat | downbeat | onset | novelty_peak), interpretation (a
# label from song_interpretation.json). See src/audiolab/visual_mapping/profile.py for every key.

name: balanced
version: "1"
description: Moderate response to loudness, onset activity and supported changes.

channels:
  intensity:
    combine: weighted_mean
    smoothing: {attack_s: 0.15, release_s: 0.6}
    rules:
      - id: bal_intensity_loudness
        input: {kind: feature, feature: rms_db}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.7
      - id: bal_intensity_onsets
        input: {kind: onset_rate, window_s: 2.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.3

  scale:
    combine: sum
    smoothing: {attack_s: 0.0, release_s: 0.0}
    rules:
      - id: bal_scale_loudness
        input: {kind: feature, feature: rms_db, smooth_s: 1.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.7
      - id: bal_scale_beats
        input: {kind: events, events: beat}
        response: {attack_s: 0.03, release_s: 0.25}
        strength: 1.0
        weight: 0.3

  density:
    combine: weighted_mean
    smoothing: {attack_s: 0.5, release_s: 1.0}
    rules:
      - id: bal_density_onsets
        input: {kind: onset_rate, window_s: 2.0}
        normalize: {method: percentile, low: 5, high: 95}

  motion_weight:
    combine: weighted_mean
    smoothing: {attack_s: 0.8, release_s: 1.5}
    rules:
      - id: bal_motion_loudness
        input: {kind: feature, feature: rms_db}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.5
      - id: bal_motion_mid
        input: {kind: feature, feature: band_mid_db}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.5

  pulse_strength:
    combine: max
    rules:
      - id: bal_pulse_beats
        input: {kind: events, events: beat}
        response: {attack_s: 0.02, release_s: 0.3}
        strength: 0.7
        beat_in_bar_strength: {1: 1.43}   # beat one reaches 1.0, the others 0.7

  transition_weight:
    combine: max
    rules:
      - id: bal_transition_candidates
        input: {kind: interpretation, label: transition_candidate}
        response: {attack_s: 0.5, release_s: 1.5}
        strength: 1.0
      - id: bal_transition_novelty
        input: {kind: feature, feature: novelty}
        normalize: {method: fixed, low: 0.2, high: 1.0}
        weight: 0.5

  detail_activity:
    combine: weighted_mean
    smoothing: {attack_s: 0.05, release_s: 0.3}
    rules:
      - id: bal_detail_high
        input: {kind: feature, feature: band_high_db}
        normalize: {method: percentile, low: 5, high: 95}
