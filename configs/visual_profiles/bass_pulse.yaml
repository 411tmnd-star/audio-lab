# bass_pulse (v2): stronger responses to bass activity, with beat-synchronised pulses whose strength
# follows the bass energy around each beat. Every beat position is treated alike: nothing assumes
# bass belongs on bar starts. Experimental creative choices, not rules about music. The Phase 7.0
# version is frozen in baseline_v1/ for comparison.
#
# v2 changes: motion_weight is smoothed (about 1 s) with a slower release (about 2 s) so it stops
# swinging with every bass gap; transition_weight gains a continuous contribution from novelty,
# with a dead band so only real changes in the music raise it; detail_activity follows high-band
# activity above a faster baseline than balanced uses.
#
# Creative override example (not enabled): to strengthen Detty-style weak fourth beats without
# touching any measurement, add under bp_pulse_bass_beats:
#   beat_in_bar_strength: {4: 1.3}
# The bass energy in the analysis is never changed by a profile; only this rule's strength is.

name: bass_pulse
version: "2"
description: Bass-led intensity and scale, pulses on beats scaled by bass energy at each beat.

channels:
  intensity:
    combine: weighted_mean
    smoothing: {attack_s: 0.05, release_s: 0.4}
    rules:
      - id: bp_intensity_bass
        input: {kind: feature, feature: band_bass_db}
        normalize: {method: percentile, low: 10, high: 98}
        weight: 0.6
      - id: bp_intensity_loudness
        input: {kind: feature, feature: rms_db}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.4

  scale:
    combine: sum
    smoothing: {attack_s: 0.0, release_s: 0.12}
    rules:
      - id: bp_scale_bass
        input: {kind: feature, feature: band_bass_db}
        normalize: {method: percentile, low: 10, high: 98}
        weight: 0.5
      - id: bp_scale_bass_beats
        input: {kind: events, events: beat}
        response: {attack_s: 0.02, release_s: 0.2}
        modulate_by: {feature: band_bass_db, normalize: {method: percentile, low: 10, high: 98}, window_s: 0.15}
        weight: 0.5

  density:
    combine: weighted_mean
    smoothing: {attack_s: 0.3, release_s: 0.8}
    rules:
      - id: bp_density_onsets
        input: {kind: onset_rate, window_s: 1.5}
        normalize: {method: percentile, low: 5, high: 95}

  motion_weight:
    combine: weighted_mean
    smoothing: {attack_s: 0.2, release_s: 2.0}
    rules:
      - id: bp_motion_bass
        input: {kind: feature, feature: band_bass_db, smooth_s: 1.0}
        normalize: {method: percentile, low: 10, high: 98}

  pulse_strength:
    combine: max
    rules:
      - id: bp_pulse_bass_beats
        input: {kind: events, events: beat}
        response: {attack_s: 0.01, release_s: 0.2}
        modulate_by: {feature: band_bass_db, normalize: {method: percentile, low: 10, high: 98}, window_s: 0.15}
      - id: bp_pulse_bass_entry
        input: {kind: interpretation, label: bass_entry}
        response: {attack_s: 0.01, hold_s: 0.1, release_s: 0.8}

  transition_weight:
    combine: max
    rules:
      - id: bp_transition_candidates
        input: {kind: interpretation, label: transition_candidate}
        response: {attack_s: 0.5, release_s: 1.0}
      - id: bp_transition_bass_entry
        input: {kind: interpretation, label: bass_entry}
        response: {attack_s: 0.1, release_s: 1.0}
      - id: bp_transition_novelty
        # Continuous: novelty below 0.3 is treated as no evidence of a transition (0). At most half
        # of the channel range, so interpreted changes remain the strongest signal.
        input: {kind: feature, feature: novelty}
        normalize: {method: fixed, low: 0.3, high: 1.0}
        weight: 0.5

  detail_activity:
    combine: weighted_mean
    smoothing: {attack_s: 0.02, release_s: 0.15}
    rules:
      - id: bp_detail_high
        input: {kind: feature, feature: band_high_db, smooth_s: 0.1, baseline_s: 2.0, baseline_mode: above}
        normalize: {method: fixed, low: 1.5, high: 6.0}
