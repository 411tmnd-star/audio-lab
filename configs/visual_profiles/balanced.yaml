# balanced (v2): a moderate, general-purpose response to energy, rhythmic activity and significant
# musical changes. Experimental creative choices, not rules about music. The Phase 7.0 version is
# frozen in baseline_v1/ for comparison.
#
# v2 changes: loudness is smoothed before normalising (brief per-beat dips no longer set the range,
# so section contrast is not compressed); beat pulses and scale pulses scale with loudness, with a
# floor, so quiet passages keep a subtle pulse without looking as intense; onset activity is mixed
# with energy at a lower weight; detail_activity follows high-band activity above a slower baseline.
#
# Rule inputs: feature (a curve from analysis.npz), onset_rate (onsets per second, counted from
# the analysis onset events), events (beat | downbeat | onset | novelty_peak), interpretation (a
# label from song_interpretation.json). See src/audiolab/visual_mapping/profile.py for every key.

name: balanced
version: "2"
description: Moderate response to loudness, onset activity and supported changes; pulses follow loudness.

channels:
  intensity:
    combine: weighted_mean
    smoothing: {attack_s: 0.15, release_s: 0.6}
    rules:
      - id: bal_intensity_loudness
        input: {kind: feature, feature: rms_db, smooth_s: 1.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.6
      - id: bal_intensity_onsets
        # Rhythmic activity keeps some intensity in a quiet passage, but at a lower weight than
        # energy, so a quiet section with a busy rhythm does not look as intense as a loud one.
        input: {kind: onset_rate, window_s: 2.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.4

  scale:
    combine: sum
    smoothing: {attack_s: 0.0, release_s: 0.0}
    rules:
      - id: bal_scale_loudness
        input: {kind: feature, feature: rms_db, smooth_s: 1.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.7
      - id: bal_scale_beats
        input: {kind: events, events: beat}
        response: {attack_s: 0.03, release_s: 0.25}
        strength: 1.0
        modulate_by:
          feature: rms_db
          smooth_s: 1.0
          normalize: {method: percentile, low: 5, high: 95}
          window_s: 0.1
          floor: 0.3          # starting value: the weakest pulse is 30% of its full strength
        weight: 0.3

  density:
    combine: weighted_mean
    smoothing: {attack_s: 0.5, release_s: 1.0}
    rules:
      - id: bal_density_onsets
        input: {kind: onset_rate, window_s: 2.0}
        normalize: {method: percentile, low: 5, high: 95}

  motion_weight:
    combine: weighted_mean
    smoothing: {attack_s: 0.8, release_s: 1.5}
    rules:
      - id: bal_motion_loudness
        input: {kind: feature, feature: rms_db, smooth_s: 1.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.5
      - id: bal_motion_mid
        input: {kind: feature, feature: band_mid_db}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.3
      - id: bal_motion_onsets
        input: {kind: onset_rate, window_s: 2.0}
        normalize: {method: percentile, low: 5, high: 95}
        weight: 0.2

  pulse_strength:
    combine: max
    rules:
      - id: bal_pulse_beats
        input: {kind: events, events: beat}
        response: {attack_s: 0.02, release_s: 0.3}
        strength: 0.7
        beat_in_bar_strength: {1: 1.43}   # beat one reaches 1.0, the others 0.7
        modulate_by:
          feature: rms_db
          smooth_s: 1.0
          normalize: {method: percentile, low: 5, high: 95}
          window_s: 0.1
          floor: 0.3

  transition_weight:
    combine: max
    rules:
      - id: bal_transition_candidates
        input: {kind: interpretation, label: transition_candidate}
        response: {attack_s: 0.5, release_s: 1.5}
        strength: 1.0
      - id: bal_transition_novelty
        input: {kind: feature, feature: novelty}
        normalize: {method: fixed, low: 0.2, high: 1.0}
        weight: 0.5

  detail_activity:
    combine: weighted_mean
    smoothing: {attack_s: 0.05, release_s: 0.3}
    rules:
      - id: bal_detail_high
        # High-band energy above its own 4 s baseline. Fixed normalization: under 1 dB above the
        # baseline is noise (0); 5 dB or more is full activity (1).
        input: {kind: feature, feature: band_high_db, smooth_s: 0.15, baseline_s: 4.0, baseline_mode: above}
        normalize: {method: fixed, low: 1.0, high: 5.0}
