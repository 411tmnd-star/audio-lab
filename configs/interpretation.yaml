# Defaults for the interpretation layer. Any key you omit falls back to config.py.
# Every value is a provisional starting point, checked by eye on two songs only.
# Thresholds are relative to the song itself (its loudest frame, beat spacing, own onset rate) or
# to a physical unit (dB, onsets per second), not to any one track.

common:
  window_beats: 8            # compare this many beats before and after a point (about 2 bars)
  min_window_fraction: 0.5   # skip points where a window is truncated below this share
  min_separation_beats: 8    # keep only the strongest hit of a label within this spacing
  smooth_s: 1.0              # moving average for smoothed loudness
  link_tolerance_beats: 2.0  # how close another interpretation must be to be linked

bass_entry:
  enabled: true
  min_rise_db: 12.0          # bass band energy rise, after window vs before window
  min_after_level_db: -30.0  # bass must end up at least this loud (dB re loudest frame)
  min_sustained_fraction: 0.5

energy_drop:
  enabled: true
  min_drop_db: 6.0           # loudness fall, before window vs after window

energy_build:
  enabled: true
  smooth_s: 3.0
  min_slope_db_per_s: 0.4
  end_slope_db_per_s: 0.1    # not 0: a flat curve's slope is numerical noise around zero
  min_duration_s: 6.0
  min_rise_db: 6.0
  merge_gap_s: 2.0
  step_window_s: 2.0         # a rise of more than max_step_db within this is a jump, not a build
  max_step_db: 6.0

high_energy_passage:
  enabled: true
  reference_percentile: 95.0 # the song's own "loud" level
  within_db: 6.0
  hysteresis_db: 2.0
  min_duration_s: 8.0
  merge_gap_s: 2.0
  min_dynamic_range_db: 6.0  # below this the song has no contrast; no passage is called elevated

sparse_passage:
  enabled: true
  below_reference_db: 12.0
  max_onset_ratio: 0.75
  hysteresis_db: 2.0
  min_duration_s: 4.0
  merge_gap_s: 2.0
  reference_percentile: 95.0

rhythmic_density_change:
  enabled: true
  min_abs_change: 1.0        # onsets per second
  min_ratio: 1.5
  ratio_floor: 0.25

transition_candidate:
  enabled: true
  min_channels: 3
  loudness_db: 6.0
  bass_db: 10.0
  mid_db: 6.0
  high_db: 6.0
  onset_min_abs_change: 1.0
  onset_min_ratio: 1.5
  onset_ratio_floor: 0.25
  novelty_tolerance_beats: 2.0
