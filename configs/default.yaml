# Defaults for audiolab. Any key you omit falls back to the value in config.py.

audio:
  sample_rate: 22050   # Hz; audio is resampled to this on load
  mono: true

features:
  n_fft: 2048
  hop_length: 512      # frames are hop_length / sample_rate seconds apart
  bass_max_hz: 150.0   # bass band: 0 Hz up to this
  mid_max_hz: 2000.0   # mid band: bass_max_hz up to this; high band: this up to Nyquist
  n_mels: 96           # rows in the stored spectrogram

beats:
  start_bpm: 120.0     # initial tempo guess for the beat tracker
  tightness: 100.0     # higher = beats locked more strictly to the tempo

events:
  onset_delta: 0.07    # peak-picking threshold for onsets (higher = fewer onsets)
  min_gap_s: 0.05      # drop onsets closer together than this (seconds)
  loud_threshold_db: -20.0  # frames above this level (dB re: song peak) open a loud segment
  loud_hysteresis_db: 6.0   # a segment closes only below (threshold - this), preventing flicker
  loud_min_duration_s: 0.5  # drop loud segments shorter than this
  loud_merge_gap_s: 0.5     # join loud segments separated by less than this

bars:
  beats_per_bar: 4    # default meter; per-song values in configs/songs.yaml override it

novelty:
  kernel_beats: 16     # width of the checkerboard kernel in beats (about 4 bars at 4/4)

plots:
  dpi: 120
  max_points: 200000   # waveform is downsampled to at most this many points
